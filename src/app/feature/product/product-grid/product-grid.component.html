<div class="page-container">
  <app-page-header [titleInput]="'Listagem de Produtos'" [isGrid]="true" />

  <div class="product-list card">
    <div class="list-toolbar">
      <div></div>

      <button mat-flat-button color="primary" type="button" (click)="newProduct()">
        <mat-icon>add</mat-icon>
        Novo produto
      </button>
    </div>

    <div class="filter-container">
      <app-product-filter
        (searchEvent)="onFilterChange($event)"
        (clearEvent)="onFilterChange({})"
      />
    </div>

    <div class="table-container">
      <table mat-table [dataSource]="dataSource" matSort (matSortChange)="changeSortBy($event)">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Nome</th>

          <td mat-cell *matCellDef="let product" [matTooltip]="product.category?.name">
            {{ product.name }}
          </td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Descrição</th>

          <td mat-cell *matCellDef="let product">
            {{ product.description || '—' }}
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="actions-column">Ações</th>

          <td mat-cell *matCellDef="let product" class="actions-column">
            <div class="actions">
              <button
                mat-icon-button
                type="button"
                matTooltip="Editar"
                (click)="editProduct(product.id)"
              >
                <mat-icon>edit</mat-icon>
              </button>

              <button
                mat-icon-button
                type="button"
                matTooltip="Excluir"
                (click)="confirmaticonDeleteClient(product.id, product.name)"
              >
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        <tr *matNoDataRow>
          <td class="mat-cell empty" [attr.colspan]="displayedColumns.length">
            Nenhum produto encontrado.
          </td>
        </tr>
      </table>
    </div>

    <mat-paginator
      [length]="pageConfig.totalElements"
      [pageIndex]="pageConfig.page"
      [pageSize]="pageConfig.pageSize"
      [pageSizeOptions]="[5, 10, 25]"
      showFirstLastButtons
      (page)="onPageChange($event)"
    />
  </div>
</div>
