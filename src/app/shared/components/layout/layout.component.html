<div class="layout">
  <aside class="sidebar">
    <div class="sidebar__brand">
      <span class="sidebar__logo">SupremeNetwork</span>
    </div>

    <nav class="sidebar__nav">
      @for (item of menuItems; track item.route) {
        <a
          class="sidebar__item"
          [routerLink]="item.route"
          routerLinkActive="sidebar__item--active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <mat-icon>{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar__title">
        <span>Dashboard</span>
      </div>

      <div class="topbar__actions">
        <button mat-icon-button matTooltip="Notificações" aria-label="Notificações">
          <mat-icon>notifications</mat-icon>
        </button>

        <button mat-icon-button matTooltip="Início" routerLink="/home" aria-label="Início">
          <mat-icon>home</mat-icon>
        </button>

        <button
          class="topbar__profile"
          [matMenuTriggerFor]="profileMenu"
          aria-label="Menu do perfil"
        >
          <mat-icon>account_circle</mat-icon>

          <span class="topbar__user">
            {{ getUserName }}
          </span>

          <mat-icon class="topbar__profile-arrow"> expand_more </mat-icon>
        </button>
      </div>

      <mat-menu #profileMenu="matMenu" class="profile-menu">
        <button mat-menu-item routerLink="/meu-perfil">
          <mat-icon>person</mat-icon>
          <span>Ver meu perfil</span>
        </button>

        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Sair</span>
        </button>
      </mat-menu>
    </header>

    <main class="layout__content">
      <router-outlet />
    </main>

    <footer class="footer">
      <app-footer></app-footer>
    </footer>
  </div>
</div>
